[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wyrit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anyio>=4,<5", "jsonschema>=4.18,<5", "mcp>=1.8,<2", "referencing>=0.28,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wyrit = ["runtime_child.cjs", "recipe_scan.cjs"]
"wyrit.console" = ["assets/*.html", "assets/*.css", "assets/*.js", "assets/*.woff2", "assets/*.txt"]
