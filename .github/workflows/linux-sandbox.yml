name: Linux sandbox

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/wyrit/native_sandbox.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libseccomp2 python3-venv util-linux
          python3 -m venv "$RUNNER_TEMP/wyrit-venv"
          "$RUNNER_TEMP/wyrit-venv/bin/python3" -m pip install .
          echo "$RUNNER_TEMP/wyrit-venv/bin" >> "$GITHUB_PATH"
      - run: scripts/verify-linux.sh
