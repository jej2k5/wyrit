# Copy to wyrit.toml and uncomment the servers you trust.
# ledger_path = "runs.jsonl"
# Relative paths are resolved against this file.
# recipes_path = "recipes"
[limits]
run_deadline = 10.0       # Seconds, including runtime startup
call_timeout = 5.0        # Seconds per capability call
max_calls = 32
max_output_bytes = 16384  # Per capability response and final return value

[servers]

# [servers.local]
# namespace = "local"
# transport = "stdio"
# command = "/absolute/path/to/mcp-server"
# args = ["--stdio"]
# expose = "all"
# deny_writes = true  # Default. Set false to allow writes for this server.
#
# [servers.local.capabilities.update_item]
# deny_writes = false  # Allow this write while the server default stays in force.
#
# [servers.local.capabilities.get_item]
# classification = "read"  # Override the tool's MCP annotations.

# [servers.remote]
# namespace = "remote"
# transport = "http"
# url = "https://mcp.example.com/mcp"
# expose = ["list_items", "get_item"]
#
# [servers.remote.limits]
# run_deadline = 30.0
# call_timeout = 15.0
#
# [servers.remote.headers]
# Authorization = { env = "MCP_API_TOKEN", prefix = "Bearer " }

# Optional MCPxy pairing over Streamable HTTP. Replace the host and upstream slug.
# [servers.mcpxy]
# namespace = "github"
# transport = "http"
# url = "https://proxy.example.com/mcp/github"
# expose = ["list_issues"]
#
# [servers.mcpxy.headers]
# Authorization = { env = "MCPXY_PROXY_TOKEN", prefix = "Bearer " }
